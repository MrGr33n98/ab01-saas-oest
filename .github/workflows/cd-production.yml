name: CD · Production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
    steps:
      - name: Check production configuration
        run: |
          set -Eeuo pipefail
          for name in NEXT_PUBLIC_API_URL NEXT_PUBLIC_APP_URL DEPLOY_HOST DEPLOY_USER DEPLOY_KNOWN_HOSTS DEPLOY_SSH_PRIVATE_KEY GHCR_PULL_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing production Environment variable or secret: $name"
              exit 1
            fi
          done

      - name: Check out the CI-verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Derive immutable image names
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          repository="$(tr '[:upper:]' '[:lower:]' <<< "$REPOSITORY")"
          echo "api=${REGISTRY}/${repository}-api" >> "$GITHUB_OUTPUT"
          echo "web=${REGISTRY}/${repository}-web" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.api }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.api }}:main
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: |
            type=gha,scope=dronehub-api
            type=registry,ref=${{ steps.image.outputs.api }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=dronehub-api
            type=registry,ref=${{ steps.image.outputs.api }}:buildcache,mode=max

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/frontend.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
          tags: |
            ${{ steps.image.outputs.web }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.web }}:main
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: |
            type=gha,scope=dronehub-web
            type=registry,ref=${{ steps.image.outputs.web }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=dronehub-web
            type=registry,ref=${{ steps.image.outputs.web }}:buildcache,mode=max

      - name: Configure SSH trust
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Authenticate the server to GHCR
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_PULL_TOKEN" | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'docker login ghcr.io --username "${{ github.repository_owner }}" --password-stdin'

      - name: Upload deployment bundle
        run: |
          set -Eeuo pipefail
          tar -czf /tmp/dronehub-deploy.tgz deploy/compose.production.yml scripts/deploy/remote-deploy.sh
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes /tmp/dronehub-deploy.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/dronehub-deploy.tgz"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'install -d -m 0750 /opt/dronehub/deploy /opt/dronehub/scripts/deploy && tar -xzf /tmp/dronehub-deploy.tgz -C /opt/dronehub && chmod 0750 /opt/dronehub/scripts/deploy/remote-deploy.sh && rm -f /tmp/dronehub-deploy.tgz'

      - name: Migrate, deploy, verify, and roll back on failure
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "API_IMAGE='${{ steps.image.outputs.api }}:${{ steps.image.outputs.tag }}' \
             WEB_IMAGE='${{ steps.image.outputs.web }}:${{ steps.image.outputs.tag }}' \
             RELEASE_SHA='${{ github.event.workflow_run.head_sha }}' \
             /opt/dronehub/scripts/deploy/remote-deploy.sh"
