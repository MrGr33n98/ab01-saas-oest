services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: dronehub
      POSTGRES_PASSWORD: dronehub
      POSTGRES_DB: dronehub_development
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dronehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dronehub
      MINIO_ROOT_PASSWORD: dronehubsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 dronehub dronehubsecret;
      mc mb -p local/dronehub-mvp || true;
      mc anonymous set download local/dronehub-mvp || true;
      exit 0;
      "

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://dronehub:dronehub@db:5432/dronehub_test
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: test
      JWT_SECRET: local-test-secret-minimum-32-chars
      ALLOW_DEV_AUTH: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -lc 'bin/rails db:create db:prepare && bundle exec rspec'
    profiles: ["test"]

volumes:
  pgdata:
  miniodata:
